// ===== สีอัตโนมัติ =====
const dateColors = {};
const dateOrder = [];

// สีคงที่สำหรับ 3 วันล่าสุด (เมื่อเปิดหน้าครั้งแรก)
// คำนวณตอน init แล้วเก็บไว้
const FIXED_LAST3_COLORS = {
  oldest: '#2e7d32',   // เขียว - วันเก่าสุดใน 3 วัน
  middle: '#1565c0',   // น้ำเงิน - วันกลาง
  newest: '#c62828'    // แดง - วันล่าสุด
};

let fixedLast3Dates = []; // เก็บ 3 วันล่าสุดของข้อมูลทั้งหมด

function getColorForDate(date) {
  if (dateColors[date]) return dateColors[date];

  // ตรวจสอบว่าเป็น 1 ใน 3 วันล่าสุด (fixed) หรือไม่
  if (fixedLast3Dates.length === 3) {
    if (date === fixedLast3Dates[0]) {
      dateColors[date] = FIXED_LAST3_COLORS.oldest;
      dateOrder.push(date);
      return dateColors[date];
    }
    if (date === fixedLast3Dates[1]) {
      dateColors[date] = FIXED_LAST3_COLORS.middle;
      dateOrder.push(date);
      return dateColors[date];
    }
    if (date === fixedLast3Dates[2]) {
      dateColors[date] = FIXED_LAST3_COLORS.newest;
      dateOrder.push(date);
      return dateColors[date];
    }
  }

  // วันที่เหลือใช้ golden angle
  const index = dateOrder.length;
  dateOrder.push(date);
  const hue = (index * 137.508) % 360;
  dateColors[date] = `hsl(${hue}, 70%, 40%)`;
  return dateColors[date];
}

function parseDataDate(ds) {
  const [dd, mm, yy] = ds.split('-');
  return new Date(2000 + parseInt(yy), parseInt(mm) - 1, parseInt(dd));
}
function parseInputDate(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatDateKey(dt) {
  const dd = String(dt.getDate()).padStart(2, '0');
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const yy = String(dt.getFullYear()).slice(-2);
  return `${dd}-${mm}-${yy}`;
}
function toInputDate(ds) {
  const [dd, mm, yy] = ds.split('-');
  return `20${yy}-${mm}-${dd}`;
}
function getUniqueSortedDates(data) {
  const set = new Set(data.map(d => d.d));
  return [...set].sort((a, b) => parseDataDate(a) - parseDataDate(b));
}
function filterData(data, fromDate, toDate) {
  return data.filter(item => {
    const d = parseDataDate(item.d);
    if (fromDate && d < fromDate) return false;
    if (toDate && d > toDate) return false;
    return true;
  });
}

// ===== Canvas & state =====
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let W, H, margin, chartW, chartH;
let yMin, yMax, yRange; // จะคำนวณจากข้อมูล

let hoveredSlot = -1;
let timeGroups = {};
let times = [];
let currentData = [];

function calcYRange(data) {
  if (data.length === 0) {
    yMin = 4100;
    yMax = 4200;
    yRange = yMax - yMin;
    return;
  }
  let min = Infinity, max = -Infinity;
  data.forEach(item => {
    if (item.l < min) min = item.l;
    if (item.h > max) max = item.h;
  });
  const padding = (max - min) * 0.08; // padding 8%
  yMin = Math.floor((min - padding) / 10) * 10; // ปัดลงเป็นสิบ
  yMax = Math.ceil((max + padding) / 10) * 10;  // ปัดขึ้นเป็นสิบ
  yRange = yMax - yMin;
}

function calcLayout() {
  const isAutoRotated = document.body.classList.contains('auto-rotated');
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  if (isAutoRotated) {
    W = vh;
    H = vw;
  } else {
    W = vw;
    H = vh;
  }

  const filterH = isAutoRotated ? 50 : 60;
  const legendH = isAutoRotated ? 35 : 45;
  const pad = isAutoRotated ? 16 : 24;
  const chartH_total = H - filterH - legendH - pad;

  margin = {
    top: 12,
    right: isAutoRotated ? 35 : 55,
    bottom: isAutoRotated ? 50 : 70,
    left: isAutoRotated ? 40 : 55
  };
  chartW = W - margin.left - margin.right;
  chartH = chartH_total - margin.top - margin.bottom;

  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = chartH_total * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = chartH_total + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function yToPixel(y) {
  return margin.top + chartH - ((y - yMin) / yRange) * chartH;
}

function buildGroups(data) {
  Object.keys(dateColors).forEach(k => delete dateColors[k]);
  dateOrder.length = 0;
  timeGroups = {};
  data.forEach(item => {
    if (!timeGroups[item.t]) timeGroups[item.t] = [];
    timeGroups[item.t].push(item);
  });
  Object.keys(timeGroups).forEach(t => {
    timeGroups[t].sort((a, b) => a.d.localeCompare(b.d));
    timeGroups[t].forEach(item => { item.color = getColorForDate(item.d); });
  });
  times = Object.keys(timeGroups).sort();
}

function draw() {
  calcLayout();
  ctx.clearRect(0, 0, W, H + 200);

  if (times.length === 0) {
    ctx.fillStyle = '#999';
    ctx.font = '18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('ไม่พบข้อมูลในช่วงวันที่เลือก', W / 2, (margin.top + chartH) / 2);
    return;
  }

  const numSlots = times.length;
  const slotW = chartW / numSlots;

  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;
  for (let y = yMin; y <= yMax; y += 20) {
    const py = yToPixel(y);
    ctx.beginPath();
    ctx.moveTo(margin.left, py);
    ctx.lineTo(W - margin.right, py);
    ctx.stroke();
  }

  ctx.strokeStyle = '#e8e8e8';
  ctx.lineWidth = 1;
  for (let i = 0; i <= numSlots; i++) {
    const px = margin.left + i * slotW;
    ctx.beginPath();
    ctx.moveTo(px, margin.top);
    ctx.lineTo(px, margin.top + chartH);
    ctx.stroke();
  }

  if (hoveredSlot >= 0 && hoveredSlot < numSlots) {
    const hx = margin.left + hoveredSlot * slotW;
    ctx.fillStyle = 'rgba(200, 220, 255, 0.25)';
    ctx.fillRect(hx, margin.top, slotW, chartH);
  }

  ctx.fillStyle = '#888';
  ctx.font = '12px Arial';
  ctx.textAlign = 'right';
  for (let y = yMin; y <= yMax; y += 20) {
    const py = yToPixel(y);
    ctx.fillText(y, margin.left - 8, py + 4);
  }

  const labelInterval = Math.max(1, Math.floor(numSlots / 18));
  ctx.fillStyle = '#666';
  ctx.font = '11px Arial';
  ctx.textAlign = 'center';

  for (let i = 0; i < numSlots; i += labelInterval) {
    const px = margin.left + i * slotW + slotW / 2;
    const t1 = times[i];
    const t2 = timeGroups[times[i]][0].t2;
    ctx.fillText(t1, px, margin.top + chartH + 16);
    ctx.fillText(t2, px, margin.top + chartH + 30);
  }

  const maxPerSlot = Math.max(...Object.values(timeGroups).map(g => g.length));
  const candleW = Math.max(2, (slotW * 0.85) / maxPerSlot);
  const candleGap = 1;

  for (let i = 0; i < numSlots; i++) {
    const group = timeGroups[times[i]];
    const slotCenterX = margin.left + i * slotW + slotW / 2;
    const groupWidth = group.length * (candleW + candleGap);
    const startX = slotCenterX - groupWidth / 2;

    group.forEach((item, j) => {
      const px = startX + j * (candleW + candleGap) + candleW / 2;
      const color = item.color;
      const oY = yToPixel(item.o);
      const cY = yToPixel(item.c);
      const hY = yToPixel(item.h);
      const lY = yToPixel(item.l);

      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(px, hY);
      ctx.lineTo(px, lY);
      ctx.stroke();

      const bodyTop = Math.min(oY, cY);
      const bodyHeight = Math.max(Math.abs(oY - cY), 1);
      ctx.fillStyle = color;
      ctx.fillRect(px - candleW / 2, bodyTop, candleW, bodyHeight);
    });
  }
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = (margin.top + chartH) / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  const numSlots = times.length;
  if (numSlots === 0) { tooltip.style.display = 'none'; return; }

  const slotW = chartW / numSlots;
  const slotIndex = Math.floor((mx - margin.left) / slotW);

  if (slotIndex >= 0 && slotIndex < numSlots && mx >= margin.left && mx <= W - margin.right && my >= margin.top && my <= margin.top + chartH) {
    hoveredSlot = slotIndex;
    draw();
    showTooltip(e.clientX, e.clientY, slotIndex);
  } else {
    if (hoveredSlot !== -1) { hoveredSlot = -1; draw(); }
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => {
  hoveredSlot = -1;
  draw();
  tooltip.style.display = 'none';
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = (margin.top + chartH) / rect.height;
  const mx = (touch.clientX - rect.left) * scaleX;
  const my = (touch.clientY - rect.top) * scaleY;

  const numSlots = times.length;
  if (numSlots === 0) return;

  const slotW = chartW / numSlots;
  const slotIndex = Math.floor((mx - margin.left) / slotW);

  if (slotIndex >= 0 && slotIndex < numSlots && mx >= margin.left && mx <= W - margin.right) {
    hoveredSlot = slotIndex;
    draw();
    showTooltip(touch.clientX, touch.clientY, slotIndex);
  }
}, { passive: false });

canvas.addEventListener('touchend', () => {
  hoveredSlot = -1;
  draw();
  tooltip.style.display = 'none';
});

function showTooltip(cx, cy, slotIndex) {
  const group = timeGroups[times[slotIndex]];
  const t1 = times[slotIndex];
  const t2 = group[0].t2;

  let html = `<div class="tt-title"> ${t1} – ${t2}</div>`;
  group.forEach(item => {
    const fmt = v => v.toFixed(2);
    html += `
      <div class="tt-row">
        <div class="tt-color" style="background:${item.color}"></div>
        <div class="tt-date">${item.d}</div>
        <div class="tt-values">
          <span><span class="lbl">O</span>${fmt(item.o)}</span>
          <span><span class="lbl">H</span>${fmt(item.h)}</span>
          <span><span class="lbl">L</span>${fmt(item.l)}</span>
          <span><span class="lbl">C</span>${fmt(item.c)}</span>
        </div>
      </div>`;
  });

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';

  const isAutoRotated = document.body.classList.contains('auto-rotated');
  const ttW = tooltip.offsetWidth;
  const ttH = tooltip.offsetHeight;

  let tx, ty;

  if (isAutoRotated) {
    const W_viewport = window.innerWidth;
    const xInMain = cy;
    const yInMain = W_viewport - cx;
    
    tx = xInMain + 10;
    ty = yInMain - ttH - 10;
    
    if (ty < 5) {
      ty = yInMain + 10;
    }
    const maxH = window.innerWidth;
    if (ty + ttH > maxH - 5) {
      ty = maxH - ttH - 5;
    }
    if (tx < 5) tx = 5;
    const maxW = window.innerHeight;
    if (tx + ttW > maxW - 5) {
      tx = maxW - ttW - 5;
    }
  } else {
    tx = cx + 10;
    ty = cy - ttH - 10;
    
    if (ty < 5) {
      ty = cy + 10;
    }
    if (tx + ttW > window.innerWidth - 5) {
      tx = cx - ttW - 10;
    }
    if (tx < 5) tx = 5;
  }

  tooltip.style.left = tx + 'px';
  tooltip.style.top = ty + 'px';
}

function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  if (dateOrder.length === 0) return;
  dateOrder.forEach(date => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <div class="legend-color" style="background:${dateColors[date]}"></div>
      <span>${date}</span>
    `;
    legend.appendChild(item);
  });
}

function updateResultInfo(data) {
  const info = document.getElementById('resultInfo');
  const uniqueDates = [...new Set(data.map(d => d.d))].sort();
  if (uniqueDates.length === 0) {
    info.textContent = 'ไม่พบข้อมูล';
  } else {
    info.textContent = `${uniqueDates.length}วัน|${data.length}rec`;
  }
}

function applyFilter(fromDate, toDate, limitToLast3 = false) {
  let filtered = filterData(rawData, fromDate, toDate);
  if (limitToLast3) {
    const uniqueDates = getUniqueSortedDates(filtered);
    if (uniqueDates.length > 3) {
      const last3 = uniqueDates.slice(-3);
      filtered = filtered.filter(item => last3.includes(item.d));
    }
  }
  currentData = filtered;
  calcYRange(filtered); // คำนวณ Y range จากข้อมูลที่กรองแล้ว
  buildGroups(filtered);
  draw();
  buildLegend();
  updateResultInfo(filtered);
}

function setDefaults() {
  const allDates = getUniqueSortedDates(rawData);
  if (allDates.length === 0) return;
  const latestDate = parseDataDate(allDates[allDates.length - 1]);
  const fiveDaysAgo = new Date(latestDate);
  fiveDaysAgo.setDate(fiveDaysAgo.getDate() - 5);
  document.getElementById('dateFrom').value = toInputDate(formatDateKey(fiveDaysAgo));
  document.getElementById('dateTo').value = toInputDate(formatDateKey(latestDate));
  applyFilter(fiveDaysAgo, latestDate, true);
}

function onSearch() {
  const fromVal = document.getElementById('dateFrom').value;
  const toVal = document.getElementById('dateTo').value;
  let fromDate = null, toDate = null;
  if (fromVal) fromDate = parseInputDate(fromVal);
  if (toVal) toDate = parseInputDate(toVal);
  if (fromDate && toDate && fromDate > toDate) {
    alert('วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด');
    return;
  }
  applyFilter(fromDate, toDate, false);
}

function onReset() { setDefaults(); }

document.getElementById('btnSearch').addEventListener('click', onSearch);
document.getElementById('btnReset').addEventListener('click', onReset);
document.getElementById('dateFrom').addEventListener('keydown', e => { if (e.key === 'Enter') onSearch(); });
document.getElementById('dateTo').addEventListener('keydown', e => { if (e.key === 'Enter') onSearch(); });

const overlay = document.getElementById('rotateOverlay');
const btnAutoRotate = document.getElementById('btnAutoRotate');
const btnContinuePortrait = document.getElementById('btnContinuePortrait');

function isMobilePortrait() {
  return window.innerWidth <= 900 && window.innerWidth < window.innerHeight;
}

function tryLockLandscape() {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {
      enableAutoRotate();
    });
  } else {
    enableAutoRotate();
  }
}

function enableAutoRotate() {
  document.body.classList.add('auto-rotated');
  overlay.classList.remove('active');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      draw();
    });
  });
}

function disableAutoRotate() {
  document.body.classList.remove('auto-rotated');
}

btnAutoRotate.addEventListener('click', tryLockLandscape);
btnContinuePortrait.addEventListener('click', () => {
  overlay.classList.remove('active');
});

window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    if (isMobilePortrait() && !document.body.classList.contains('auto-rotated')) {
      overlay.classList.add('active');
    } else {
      overlay.classList.remove('active');
      if (!isMobilePortrait()) disableAutoRotate();
    }
    draw();
  }, 300);
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (isMobilePortrait() && !document.body.classList.contains('auto-rotated')) {
      overlay.classList.add('active');
    } else {
      overlay.classList.remove('active');
    }
    draw();
  }, 150);
});

// ===== Init: คำนวณ 3 วันล่าสุดของข้อมูลทั้งหมด เพื่อใช้สีคงที่ =====
const allDates = getUniqueSortedDates(rawData);
if (allDates.length >= 3) {
  fixedLast3Dates = allDates.slice(-3); // [oldest, middle, newest]
} else {
  fixedLast3Dates = allDates;
}

setDefaults();

if (isMobilePortrait()) {
  overlay.classList.add('active');
}
</script>
