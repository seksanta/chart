<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 ระบบบันทึกคะแนนการประกวด (Demo)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
    padding: 10px;
}
.container { max-width: 1200px; margin: 0 auto; }
header {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
header h1 { color: #4a5fc1; font-size: 1.6em; }
header p { color: #666; margin-top: 5px; }
.judge-info { margin-top: 8px; color: #666; }
.save-status {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    background: #e8f5e9;
    color: #2e7d32;
    border-radius: 20px;
    font-size: 0.85em;
}
.save-status.saving { background: #fff3e0; color: #e65100; }
.card {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.card label { display: block; font-weight: bold; margin-bottom: 8px; }
select {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1em;
}
.judge-btn {
    display: block;
    padding: 12px 20px;
    background: #4a5fc1;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    margin: 8px 0;
    transition: 0.2s;
    cursor: pointer;
    border: none;
    text-align: left;
    font-size: 1em;
}
.judge-btn:hover { background: #3a4ea8; transform: translateX(5px); }
.toolbar { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
    padding: 10px 20px;
    background: #fff;
    color: #4a5fc1;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    border: 2px solid #4a5fc1;
    cursor: pointer;
    font-size: 1em;
}
.btn-primary { background: #4a5fc1; color: #fff; }
.work-card {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.work-header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 15px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}
.work-header h3 { flex: 1; min-width: 200px; }
.author { opacity: 0.9; font-size: 0.9em; }
.total-score {
    background: rgba(255,255,255,0.25);
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: bold;
}
.criteria-table { width: 100%; border-collapse: collapse; }
.criteria-table th, .criteria-table td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #eee;
}
.criteria-table th { background: #f5f7ff; font-weight: 600; }
.score-input {
    width: 80px;
    padding: 8px;
    border: 2px solid #ddd;
    border-radius: 6px;
    text-align: center;
    font-size: 1em;
}
.score-input:focus { border-color: #4a5fc1; outline: none; }
.score-input.invalid { border-color: #e53935; background: #ffebee; }
.weight { color: #666; font-weight: 600; }
.weighted { color: #4a5fc1; font-weight: bold; }
.rank-table { width: 100%; background: #fff; border-radius: 12px; overflow: hidden; border-collapse: collapse; }
.rank-table th { background: #4a5fc1; color: #fff; padding: 12px; }
.rank-table td { padding: 12px; border-bottom: 1px solid #eee; }
.rank-1 { background: #fff8e1; font-weight: bold; }
.rank-2 { background: #f5f5f5; }
.rank-3 { background: #fbe9e7; }
.page { display: none; }
.page.active { display: block; }
.info-box {
    background: #e3f2fd;
    border-left: 4px solid #1976d2;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 0.9em;
}
@media (max-width: 768px) {
    header h1 { font-size: 1.2em; }
    .criteria-table th:nth-child(4),
    .criteria-table td:nth-child(4) { display: none; }
    .score-input { width: 70px; padding: 6px; }
    .work-header { flex-direction: column; align-items: flex-start; }

<!-- ==================== หน้าหลัก ==================== -->

    </header>

    <div class="card">

</div>

<!-- ==================== หน้าบันทึกคะแนน ==================== -->
<div id="pageScoring" class="page">

    </div>

    <div id="scoringArea"></div>
</div>

<!-- ==================== หน้าอันดับ ==================== -->
<div id="pageRanking" class="page">

    </div>

function getDB() {
    return JSON.parse(localStorage.getItem(DB_KEY));
}

function saveDB(db) {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function resetAll() {
    if (confirm('ล้างข้อมูลคะแนนทั้งหมด?')) {
        localStorage.removeItem(DB_KEY);
        initDB();
        location.reload();

// ============================================================
// 🎨 UI Controllers
// ============================================================
let currentCategoryId = null;
let currentJudgeId = null;
let saveQueue = {};
let saveTimer = null;

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
}

// ---------- หน้าหลัก ----------
function initHome() {
    const db = getDB();
    const sel = document.getElementById('categorySelect');
    sel.innerHTML = '<option value="">-- เลือกประเภท --</option>';
    db.categories.forEach(c => {
        sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    });
}

function loadJudges() {
    const catId = parseInt(document.getElementById('categorySelect').value);
    if (!catId) {
        document.getElementById('judgeCard').style.display = 'none';
        document.getElementById('rankingCard').style.display = 'none';
        return;
    }
    currentCategoryId = catId;
    const db = getDB();
    const judges = db.judge_categories
        .filter(jc => jc.category_id === catId)
        .map(jc => db.judges.find(j => j.id === jc.judge_id));

    const list = document.getElementById('judgeList');
    list.innerHTML = '';
    judges.forEach(j => {
        const btn = document.createElement('button');
        btn.className = 'judge-btn';
        btn.textContent = `👤 ${j.name}`;
        btn.onclick = () => startScoring(catId, j.id);
        list.appendChild(btn);
    });
    document.getElementById('judgeCard').style.display = 'block';
    document.getElementById('rankingCard').style.display = 'block';
}

// ---------- หน้าบันทึกคะแนน ----------
function startScoring(catId, judgeId) {
    currentCategoryId = catId;
    currentJudgeId = judgeId;
    const db = getDB();
    const cat = db.categories.find(c => c.id === catId);
    const judge = db.judges.find(j => j.id === judgeId);

    document.getElementById('categoryName').textContent = cat.name;
    document.getElementById('judgeName').textContent = judge.name;

    const works = db.works.filter(w => w.category_id === catId);
    const criteria = db.criteria.filter(c => c.category_id === catId);

    renderScoringTable(works, criteria, db.scores);
    showPage('pageScoring');
}

function renderScoringTable(works, criteria, scores) {
    const area = document.getElementById('scoringArea');
    let html = '';

    works.forEach(work => {
        html += `<div class="work-card">
            <div class="work-header">
                <h3>${work.title}</h3>
                <span class="author">โดย ${work.author}</span>
                <span class="total-score" id="total_${work.id}">คะแนนรวม: 0.00</span>
            </div>
            <table class="criteria-table">
                <thead>
                    <tr>
                        <th>เกณฑ์การประเมิน</th>
                        <th>น้ำหนัก</th>
                        <th>คะแนน (1-10)</th>
                        <th>คะแนนถ่วงน้ำหนัก</th>
                    </tr>
                </thead>
                <tbody>`;

        criteria.forEach(c => {
            const key = `${currentJudgeId}_${work.id}_${c.id}`;
            const savedScore = scores[key] || '';
            html += `<tr>
                <td>${c.name}</td>
                <td class="weight">${c.weight}%</td>
                <td>
                    <input type="number" min="1" max="10" step="0.1"
                           class="score-input"
                           data-work="${work.id}"
                           data-criteria="${c.id}"
                           data-weight="${c.weight}"
                           value="${savedScore}"
                           oninput="onScoreChange(this)">
                </td>
                <td class="weighted" id="w_${key}">-</td>
            </tr>`;
        });

        html += `</tbody></table></div>`;
    });

    area.innerHTML = html;

    // คำนวณคะแนนเริ่มต้น
    document.querySelectorAll('.score-input').forEach(inp => {
        if (inp.value) updateWeightedScore(inp);
    });
}

function onScoreChange(input) {
    const val = parseFloat(input.value);
    const workId = input.dataset.work;
    const criteriaId = input.dataset.criteria;

    if (input.value !== '' && (isNaN(val) || val < 1 || val > 10)) {
        input.classList.add('invalid');
        return;
    }
    input.classList.remove('invalid');

    updateWeightedScore(input);
    if (input.value !== '') {
        queueSave(workId, criteriaId, val);
    }
}

function updateWeightedScore(input) {
    const workId = input.dataset.work;
    const criteriaId = input.dataset.criteria;
    const weight = parseFloat(input.dataset.weight);
    const val = parseFloat(input.value) || 0;
    const weighted = (val * weight / 100).toFixed(2);
    const key = `${currentJudgeId}_${workId}_${criteriaId}`;

    document.getElementById(`w_${key}`).textContent = input.value ? weighted : '-';
    recalcTotal(workId);
}

function recalcTotal(workId) {
    let total = 0;
    document.querySelectorAll(`input[data-work="${workId}"]`).forEach(inp => {
        const v = parseFloat(inp.value) || 0;
        const w = parseFloat(inp.dataset.weight);
        total += v * w / 100;
    });
    document.getElementById(`total_${workId}`).textContent = `คะแนนรวม: ${total.toFixed(2)}`;
}

// ---------- Auto-Save ----------
function queueSave(workId, criteriaId, score) {
    const key = `${currentJudgeId}_${workId}_${criteriaId}`;
    saveQueue[key] = { judgeId: currentJudgeId, workId, criteriaId, score };
    setStatus('⏳ กำลังบันทึก...', 'saving');

    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 300);
}

function flushSave() {
    const items = Object.values(saveQueue);
    saveQueue = {};
    if (items.length === 0) return;

    const db = getDB();
    items.forEach(item => {
        const key = `${item.judgeId}_${item.workId}_${item.criteriaId}`;
        db.scores[key] = item.score;
    });
    saveDB(db);

    const now = new Date().toLocaleTimeString('th-TH');
    setStatus(`✓ บันทึกแล้ว (${now})`, '');
}

function setStatus(msg, cls) {
    const el = document.getElementById('saveStatus');
    el.textContent = msg;
    el.className = 'save-status ' + cls;
}

// ---------- หน้า Ranking ----------
function showRanking() {
    const sel = document.getElementById('rankCategorySelect');
    const db = getDB();
    sel.innerHTML = '';
    db.categories.forEach(c => {
        sel.innerHTML += `<option value="${c.id}" ${c.id === currentCategoryId ? 'selected' : ''}>${c.name}</option>`;
    });
    renderRanking();
    showPage('pageRanking');
}

function renderRanking() {
    const catId = parseInt(document.getElementById('rankCategorySelect').value);
    const db = getDB();
    const works = db.works.filter(w => w.category_id === catId);
    const criteria = db.criteria.filter(c => c.category_id === catId);
    const judgesInCat = db.judge_categories
        .filter(jc => jc.category_id === catId)
        .map(jc => db.judges.find(j => j.id === jc.judge_id));

    // คำนวณคะแนนผลงาน
    const workScores = works.map(w => {
        let total = 0;
        let judgeCount = 0;
        const judgeScores = {};

        judgesInCat.forEach(j => {
            let jTotal = 0;
            let hasAny = false;
            criteria.forEach(c => {
                const key = `${j.id}_${w.id}_${c.id}`;
                const s = db.scores[key];
                if (s !== undefined) {
                    jTotal += s * c.weight / 100;
                    hasAny = true;
                }
            });
            if (hasAny) {
                judgeScores[j.id] = jTotal;
                total += jTotal;
                judgeCount++;
            }
        });

        return {
            work: w,
            total: total,
            avg: judgeCount > 0 ? total / judgeCount : 0,
            judgeCount: judgeCount,
            judgeScores: judgeScores
        };
    });

    workScores.sort((a, b) => b.total - a.total);

    // คำนวณคะแนนกรรมการ (ค่าเฉลี่ยถ่วงน้ำหนักที่ให้กับทุกผลงานในประเภท)
    const judgeStats = judgesInCat.map(j => {
        let sumWeighted = 0;
        let count = 0;
        works.forEach(w => {
            let wTotal = 0;
            let hasAny = false;
            criteria.forEach(c => {
                const key = `${j.id}_${w.id}_${c.id}`;
                const s = db.scores[key];
                if (s !== undefined) {
                    wTotal += s * c.weight / 100;
                    hasAny = true;
                }
            });
            if (hasAny) {
                sumWeighted += wTotal;
                count++;
            }
        });
        return {
            judge: j,
            avg: count > 0 ? sumWeighted / count : 0,
            scoredWorks: count
        };
    });
    judgeStats.sort((a, b) => b.avg - a.avg);

    // Render
    let html = '<div class="card"><h2>📊 อันดับผลงาน</h2><br>';
    html += '<table class="rank-table"><thead><tr><th>อันดับ</th><th>ผลงาน</th><th>ผู้แต่ง</th><th>กรรมการให้คะแนน</th><th>คะแนนรวม</th><th>คะแนนเฉลี่ย</th></tr></thead><tbody>';
    workScores.forEach((w, i) => {
        const cls = i < 3 ? `rank-${i+1}` : '';
        const medal = ['🥇','🥈','🥉'][i] || (i+1);
        html += `<tr class="${cls}">
            <td>${medal}</td>
            <td>${w.work.title}</td>
            <td>${w.work.author}</td>
            <td>${w.judgeCount} / ${judgesInCat.length}</td>
            <td><strong>${w.total.toFixed(2)}</strong></td>
            <td>${w.avg.toFixed(2)}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';

    // ตารางแยกตามกรรมการแต่ละท่าน
    html += '<div class="card"><h2>👥 Ranking การให้คะแนนของกรรมการแต่ละท่าน</h2>';
    html += '<p style="color:#666;margin:8px 0;">แสดงอันดับผลงานที่กรรมการแต่ละท่านให้คะแนนสูงสุด</p>';

    judgesInCat.forEach(j => {
        const jWorks = works.map(w => {
            let total = 0;
            let filled = 0;
            criteria.forEach(c => {
                const key = `${j.id}_${w.id}_${c.id}`;
                const s = db.scores[key];
                if (s !== undefined) {
                    total += s * c.weight / 100;
                    filled++;
                }
            });
            return { work: w, total, filled };
        }).filter(x => x.filled > 0).sort((a, b) => b.total - a.total);

        html += `<div style="margin-top:15px;padding:12px;background:#f5f7ff;border-radius:8px;">
            <strong>👤 ${j.name}</strong>
            <table class="rank-table" style="margin-top:8px;">
                <thead><tr><th>อันดับ</th><th>ผลงาน</th><th>คะแนนถ่วงน้ำหนัก</th></tr></thead><tbody>`;
        if (jWorks.length === 0) {
            html += '<tr><td colspan="3" style="text-align:center;color:#999;">ยังไม่มีคะแนน</td></tr>';
        } else {
            jWorks.forEach((w, i) => {
                const medal = ['🥇','🥈','🥉'][i] || (i+1);
                const cls = i < 3 ? `rank-${i+1}` : '';
                html += `<tr class="${cls}"><td>${medal}</td><td>${w.work.title}</td><td><strong>${w.total.toFixed(2)}</strong></td></tr>`;
            });
        }
        html += '</tbody></table></div>';
    });
    html += '</div>';

    // สรุปกรรมการ
    html += '<div class="card"><h2>📈 สรุปคะแนนเฉลี่ยของกรรมการ</h2><br>';
    html += '<table class="rank-table"><thead><tr><th>อันดับ</th><th>กรรมการ</th><th>จำนวนผลงานที่ให้คะแนน</th><th>คะแนนเฉลี่ย</th></tr></thead><tbody>';
    judgeStats.forEach((j, i) => {
        html += `<tr><td>${i+1}</td><td>${j.judge.name}</td><td>${j.scoredWorks}</td><td><strong>${j.avg.toFixed(2)}</strong></td></tr>`;
    });
    html += '</tbody></table></div>';

    document.getElementById('rankingArea').innerHTML = html;
}

// ---------- บันทึกก่อนปิด ----------
window.addEventListener('beforeunload', (e) => {
    if (Object.keys(saveQueue).length > 0) {
        flushSave();
    }
});

// ---------- Init ----------
initDB();
initHome();
</script>
